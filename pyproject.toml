[project]
name = "dexcom-agent-tools"
version = "0.1.0"
description = "MCP server + agent skill for reading and analyzing Dexcom CGM data via Dexcom Share"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patryk Oleniuk" }]
dependencies = [
    "mcp>=2.3,<3",
    "pydexcom>=0.5.1,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dexcom-mcp = "dexcom_agent_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dexcom_agent_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8"]
